<div *ngIf="authService.usuarioActual() && !authService.requiereCambioPassword(); else publicLayout" class="main-layout">
  <app-header (toggleSidebar)="toggleSidebar()"></app-header>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" opened="true" [class.colapsado]="sidebarColapsado" class="app-sidenav">
      <app-sidebar [colapsado]="sidebarColapsado"></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ng-template #publicLayout>
  <router-outlet></router-outlet>
</ng-template>
