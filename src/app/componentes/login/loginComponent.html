<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title class="title">Gestión de Almacén</mat-card-title>
      <mat-card-subtitle>Ingresa tus credenciales para acceder</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="field-full">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ej. jperez" autocomplete="username">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            El usuario es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-full">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••" autocomplete="current-password">
          <button mat-icon-button matSuffix (click)="ocultarPassword = !ocultarPassword" type="button" [attr.aria-label]="'Ocultar contraseña'" [attr.aria-pressed]="ocultarPassword">
            <mat-icon>{{ocultarPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            La contraseña es requerida
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="btn-submit" [disabled]="cargando">
          {{ cargando ? 'Iniciando sesión...' : 'Ingresar' }}
        </button>

        <div class="forgot-box">
          <a routerLink="/recuperar-password" class="forgot-link">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
