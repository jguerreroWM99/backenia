<div class="recuperar-container">
  <mat-card class="recuperar-card">
    <mat-card-header>
      <mat-card-title>Recuperar Contraseña</mat-card-title>
      <mat-card-subtitle>Ingresa tus datos para restablecer tu clave</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ej. jperez">
          <mat-error *ngIf="recuperarForm.get('username')?.hasError('required')">
            El usuario es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Documento de Identidad (DNI)</mat-label>
          <input matInput formControlName="documentoIdentidad" placeholder="Ej. 12345678">
          <mat-error *ngIf="recuperarForm.get('documentoIdentidad')?.hasError('required')">
            El documento es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fecha de Nacimiento</mat-label>
          <input matInput type="date" formControlName="fechaNacimiento">
          <mat-error *ngIf="recuperarForm.get('fechaNacimiento')?.hasError('required')">
            La fecha es requerida
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva Contraseña</mat-label>
          <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="nuevaPassword" placeholder="••••••••">
          <button mat-icon-button matSuffix (click)="ocultarPassword = !ocultarPassword" type="button" [attr.aria-label]="'Ocultar contraseña'" [attr.aria-pressed]="ocultarPassword">
            <mat-icon>{{ocultarPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="recuperarForm.get('nuevaPassword')?.hasError('required')">
            La contraseña es requerida
          </mat-error>
          <mat-error *ngIf="recuperarForm.get('nuevaPassword')?.hasError('minlength')">
            Mínimo 6 caracteres
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width btn-action" [disabled]="cargando">
          {{ cargando ? 'Restableciendo...' : 'Restablecer Contraseña' }}
        </button>

        <div class="link-box">
          <a routerLink="/login" class="link-login">Volver a iniciar sesión</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
