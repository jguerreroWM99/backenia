<div class="cambio-wrapper">
  <mat-card class="cambio-card">
    <mat-card-header>
      <mat-card-title>Cambio de Contraseña Obligatorio</mat-card-title>
      <mat-card-subtitle>Por seguridad, actualiza tu contraseña inicial antes de continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="cambio-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña Actual</mat-label>
          <input matInput [type]="ocultarActual ? 'password' : 'text'" formControlName="passwordActual">
          <button mat-icon-button matSuffix type="button" (click)="ocultarActual = !ocultarActual">
            <mat-icon>{{ ocultarActual ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('passwordActual')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva Contraseña</mat-label>
          <input matInput [type]="ocultarNueva ? 'password' : 'text'" formControlName="passwordNueva">
          <button mat-icon-button matSuffix type="button" (click)="ocultarNueva = !ocultarNueva">
            <mat-icon>{{ ocultarNueva ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('passwordNueva')?.hasError('required')">Requerido</mat-error>
          <mat-error *ngIf="form.get('passwordNueva')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar Nueva Contraseña</mat-label>
          <input matInput [type]="ocultarConfirmar ? 'password' : 'text'" formControlName="confirmarPassword">
          <button mat-icon-button matSuffix type="button" (click)="ocultarConfirmar = !ocultarConfirmar">
            <mat-icon>{{ ocultarConfirmar ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('confirmarPassword')?.hasError('required')">Requerido</mat-error>
          <mat-error *ngIf="form.get('confirmarPassword')?.hasError('noCoincide')">Las contraseñas no coinciden</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width btn-save" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Actualizar Contraseña' }}
        </button>

        <button mat-button type="button" color="warn" class="full-width" (click)="authService.logout()">
          Cancelar y Cerrar Sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
